<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4A6BC">
  <title>dorothy zbornak</title>
  <style>
    * { box-sizing: border-box; }

    html { background: #F4A6BC; color-scheme: only light; }

    body {
      margin: 0;
      padding: 32px 18px 50px;
      min-height: 100vh;
      background: #F4A6BC;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
      text-align: center;
    }

    h1 {
      
      color: #000000 !important;
      margin: 0;
      font-size: clamp(30px, 6vw, 48px);
      font-weight: 700;
      line-height: 1.15;
      text-transform: lowercase;
    }

    /* Keep palm trees beside the photo, never over the buttons. */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 560px) minmax(0, 1fr);
      grid-template-areas: "left photo right";
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    .palm-panel {
      display: flex;
      min-width: 0;
      justify-content: center;
      align-items: center;
    }

    .palm-left { grid-area: left; }
    .palm-right { grid-area: right; }

    .palm-tree {
      display: block;
      width: 100%;
      max-width: 230px;
      height: auto;
      pointer-events: none;
    }

    .palm-right .palm-tree { transform: scaleX(-1); }

    .dorothy-photo {
      grid-area: photo;
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }

    /* Five columns on desktop, three on tablet, two on mobile. */
    .soundboard {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .sound {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 85px;
      padding: 14px 12px;
      border: none;
      border-radius: 12px;
      background: #B9DAF3;
      color: #000;
      font: 600 15px/1.4 Arial, Helvetica, sans-serif;
      text-align: center;
      text-transform: lowercase;
      overflow-wrap: anywhere;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .2s, transform .15s;
    }

    .sound:hover { background: #95C8ED; }
    .sound:active { background: #79B9E5; transform: scale(.97); }
    .sound.is-playing { background: #89C3EA; }

    .sound:focus-visible {
      outline: 3px solid #000;
      outline-offset: 3px;
    }

    @media (max-width: 900px) {
      .soundboard { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      body { padding: 24px 16px 40px; }

      .hero {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas: "left right" "photo photo";
        gap: 12px;
      }

      .palm-panel {
        height: 134px;
        overflow: hidden;
        align-items: flex-start;
      }

      .palm-tree { width: 120px; }
    }

    @media (max-width: 560px) {
      .soundboard {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .sound {
        min-height: 80px;
        padding: 12px 10px;
        font-size: 14px;
      }
    }

    @media (max-width: 320px) {
      .soundboard { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sound { transition: none; }
    }
  </style>
</head>

    <audio id="dorothy-audio" preload="none"></audio>

  <script>
    const player = document.getElementById('dorothy-audio');
    const buttons = Array.from(document.querySelectorAll('.sound'));
    let playingButton = null;

    function clearPlayingState() {
      if (playingButton) {
        playingButton.classList.remove('is-playing');
        playingButton.removeAttribute('aria-pressed');
        playingButton = null;
      }
    }

    buttons.forEach(button => {
      button.addEventListener('click', async () => {
        player.pause();
        clearPlayingState();
        playingButton = button;
        button.classList.add('is-playing');
        button.setAttribute('aria-pressed', 'true');
        player.src = button.dataset.audio;
        player.currentTime = 0;

        try {
          await player.play();
        } catch (error) {
          // Interrupted play() calls are expected when clicking rapidly.
          if (playingButton === button) clearPlayingState();
          console.error('Audio could not play:', error);
        }
      });
    });

    player.addEventListener('ended', clearPlayingState);
    player.addEventListener('error', clearPlayingState);
  </script>
